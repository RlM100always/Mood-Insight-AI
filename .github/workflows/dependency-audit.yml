name: Dependency vulnerability audit

on:
  push:
    branches: [main]
    paths:
      - 'mobile/package.json'
      - 'backend/requirements.txt'
      - 'research/requirements.txt'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/package.json'
      - 'backend/requirements.txt'
      - 'research/requirements.txt'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve mobile dependency tree
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Audit research Python dependencies
        run: pip-audit -r research/requirements.txt
