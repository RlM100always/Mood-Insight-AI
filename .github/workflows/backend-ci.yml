name: Flask API and Australian dataset checks
on:
  push:
    paths:
      - 'backend/**'
      - 'research/data/**'
      - 'mobile/src/data/australian_nsmhw.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'research/data/**'
      - 'mobile/src/data/australian_nsmhw.json'
      - '.github/workflows/backend-ci.yml'
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Test Flask API, encrypted storage, auth, real Australian data
        run: python -m unittest discover -s backend/tests -v
