name: Quality checks
on:
  push:
  pull_request:
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check logic.mjs
      - run: node --test tests/logic.test.mjs
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/requirements.txt
      - run: python -m unittest discover -s research/tests -v
